name: LifeOS
options:
  bundleIdPrefix: it.danieleporcaro
  deploymentTarget:
    iOS: "17.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.14.0"
    CURRENT_PROJECT_VERSION: "31"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: CHANGELOG.md
        buildPhase: resources
      # iPhone: a plain 1024 px icon in an asset catalog (the .icon format did not show up on the device).
      - iOSAssets
    entitlements:
      path: Sources/LifeOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.danieleporcaro.lifeos
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LifeOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSHealthShareUsageDescription: LifeOS legge passi, calorie, sonno, peso e battito da Apple Salute per mostrarli nella sezione Salute.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: LifeOS legge e aggiorna i tuoi promemoria per mostrarli nella sessione e aggiungerne di nuovi.
        INFOPLIST_KEY_NSRemindersUsageDescription: LifeOS legge e aggiorna i tuoi promemoria per mostrarli nella sessione e aggiungerne di nuovi.
  LifeOSMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - LifeOS.entitlements
      - path: CHANGELOG.md
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    entitlements:
      path: Mac/LifeOSMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_NAME: LifeOS
        PRODUCT_BUNDLE_IDENTIFIER: it.danieleporcaro.lifeos
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LifeOS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: LifeOS legge e aggiorna i tuoi promemoria per mostrarli nella sessione e aggiungerne di nuovi.
        INFOPLIST_KEY_NSRemindersUsageDescription: LifeOS legge e aggiorna i tuoi promemoria per mostrarli nella sessione e aggiungerne di nuovi.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
